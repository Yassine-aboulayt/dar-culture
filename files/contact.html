<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Dar Culture</title>
  <link rel="stylesheet" href="style.css">
  <script src="validation.js" defer></script>
</head>
<body>
  <header>
    <img src="../images/logo white.png" alt="Dar Culture" width="160">
    <nav>
      <a href="index.html">Accueil</a>
      <a href="Apropos.html">À propos</a>
      <a href="inscription.html">Inscription</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <p class="info">
    La balise &lt;nav&gt; regroupe les liens du menu.
    Contrairement à une &lt;div&gt;, elle identifie une zone de navigation pour les lecteurs d’écran.
  </p>
  <main>
    <section>
      <h1>Contact</h1>
      <form id="contactForm">
        <label for="cname">Nom</label>
        <input type="text" id="cname" name="cname" required>

        <label for="cemail">Email</label>
        <input type="email" id="cemail" name="cemail" required aria-describedby="emailErrorCon">
        <p id="emailErrorCon" class="error" aria-live="polite"></p>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>
  <footer>© Dar Culture — Tous droits réservés.</footer>
</body>
</html>
